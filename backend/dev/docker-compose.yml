# Local Oracle for development only. Not part of the demo deployment.
# Seed is applied manually: see dev/README.md
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: runt-demo-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: runtdemo
      APP_USER: RUNTPROD
      APP_USER_PASSWORD: runtdemo
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
